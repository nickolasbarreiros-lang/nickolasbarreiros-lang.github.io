<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 170" role="img" aria-labelledby="title desc">
  <title id="title">Orquidário Digital</title>
  <desc id="desc">Marca botânica com uma orquídea clara de labelo magenta, folhas verdes, medalhão dourado e o nome Orquidário Digital.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7df8a"/>
      <stop offset="0.52" stop-color="#d8ad3f"/>
      <stop offset="1" stop-color="#9e7420"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8de"/>
      <stop offset="1" stop-color="#e8d39a"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9aab58"/>
      <stop offset="1" stop-color="#315f37"/>
    </linearGradient>
    <linearGradient id="lip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e34987"/>
      <stop offset="0.55" stop-color="#b51e63"/>
      <stop offset="1" stop-color="#781347"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="1.8" flood-color="#001f12" flood-opacity=".32"/></filter>
  </defs>

  <!-- Botanical emblem -->
  <g transform="translate(7 4)" filter="url(#soft)">
    <circle cx="80" cy="80" r="65" fill="#073f27" stroke="url(#gold)" stroke-width="3"/>
    <circle cx="80" cy="80" r="58" fill="none" stroke="#f1d677" stroke-opacity=".45" stroke-width="1"/>

    <!-- laurel / leaves -->
    <path d="M22 114 C34 99, 48 92, 62 91 C50 105, 39 115, 22 114Z" fill="url(#leaf)" stroke="#d4b44f" stroke-width="1"/>
    <path d="M28 126 C43 112, 56 106, 70 105 C58 119, 45 127, 28 126Z" fill="url(#leaf)" stroke="#d4b44f" stroke-width="1"/>
    <path d="M138 114 C126 99, 112 92, 98 91 C110 105, 121 115, 138 114Z" fill="url(#leaf)" stroke="#d4b44f" stroke-width="1"/>
    <path d="M132 126 C117 112, 104 106, 90 105 C102 119, 115 127, 132 126Z" fill="url(#leaf)" stroke="#d4b44f" stroke-width="1"/>
    <path d="M26 121 Q52 103 79 105 Q108 103 134 121" fill="none" stroke="#d6b552" stroke-width="1.4"/>

    <!-- orchid petals -->
    <ellipse cx="80" cy="48" rx="21" ry="35" fill="url(#petal)" stroke="#d7b85d" stroke-width="1.3"/>
    <ellipse cx="50" cy="65" rx="27" ry="19" transform="rotate(26 50 65)" fill="url(#petal)" stroke="#d7b85d" stroke-width="1.3"/>
    <ellipse cx="110" cy="65" rx="27" ry="19" transform="rotate(-26 110 65)" fill="url(#petal)" stroke="#d7b85d" stroke-width="1.3"/>
    <ellipse cx="57" cy="91" rx="24" ry="16" transform="rotate(-21 57 91)" fill="url(#petal)" stroke="#d7b85d" stroke-width="1.3"/>
    <ellipse cx="103" cy="91" rx="24" ry="16" transform="rotate(21 103 91)" fill="url(#petal)" stroke="#d7b85d" stroke-width="1.3"/>

    <!-- flower throat and lip -->
    <path d="M67 71 Q80 61 93 71 Q90 84 80 88 Q70 84 67 71Z" fill="#f4b64b" stroke="#8e4c2a" stroke-width="1"/>
    <path d="M63 81 Q80 72 97 81 C99 96 92 109 80 115 C68 109 61 96 63 81Z" fill="url(#lip)" stroke="#6d163e" stroke-width="1.2"/>
    <path d="M69 84 Q80 78 91 84 Q88 94 80 98 Q72 94 69 84Z" fill="#f3b64a" opacity=".95"/>
    <path d="M73 87 L78 95 M87 87 L82 95" stroke="#7f2344" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="80" cy="72" r="4.5" fill="#fff1b8" stroke="#a86d2c" stroke-width="1"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(170 23)">
    <text x="0" y="63" fill="#fff4cf" font-family="Georgia, 'Times New Roman', serif" font-size="61" font-weight="700" letter-spacing="-1.1">Orquidário</text>
    <path d="M4 82 H93" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
    <path d="M330 82 H430" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="101" cy="82" r="2.8" fill="#d9b34b"/>
    <circle cx="322" cy="82" r="2.8" fill="#d9b34b"/>
    <text x="121" y="91" fill="#e3c569" font-family="Georgia, 'Times New Roman', serif" font-size="23" letter-spacing="10">DIGITAL</text>
  </g>
</svg>
