name: Conferência visual MACS 1.1 — ficha 024
on:
  push:
    paths:
      - '.github/workflows/conferir-visual-macs-ficha-024.yml'
      - 'dados/orquideas/arpophyllum-giganteum.js'
      - 'orquidea.html'
      - 'ficha.js'
      - 'estilos.css'
      - 'js/**'
      - 'css/**'
  workflow_dispatch:
jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Conferir ficha em navegador real
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/orquidario-server.log 2>&1 &
          node <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1465,height:900},deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror',error=>errors.push(error.message));
            await page.goto('http://127.0.0.1:8765/orquidea.html?id=arpophyllum-giganteum',{waitUntil:'networkidle',timeout:60000});
            // Detecta publicação de textos antigos observados no PDF de 04/11.
            const fullText=await page.locator('#ficha').innerText();
            if(!fullText.includes('O cultivo vegetativo é possível em clima quente'))throw Error('Adaptação regional ainda exibe redação antiga ou incompleta');
            if(!fullText.includes('não há comprovação experimental'))throw Error('Rega ainda não apresenta ressalva científica sobre repouso');
            if(!fullText.includes('referência sazonal'))throw Error('Floração ainda não apresenta ressalva de calendário');
            const cultivation=page.locator('.formas-cultivo-v4');
            if(await cultivation.count()!==1)throw Error('Componente visual de cultivo ausente ou duplicado');
            const cultivationMethods=page.locator('.formas-cultivo-v4 .forma-principal-v4, .formas-cultivo-v4 .alternativa-forma-v41');
            if(await cultivationMethods.count()!==4)throw Error('Esperados 1 principal + 3 alternativas; encontrados '+await cultivationMethods.count());
            const cultivationText=await cultivation.innerText();
            if(!cultivationText.includes('Vaso plástico')||!cultivationText.includes('Vaso de Barro')||!cultivationText.includes('Cachepô de Madeira')||!cultivationText.includes('Vaso plástico vasado'))throw Error('Métodos de cultivo divergentes');
            const section=page.locator('.substrato-visual-v4');
            await section.waitFor({timeout:30000});
            const entries=page.locator('.substratos-recomendados-v4 li');
            if(await entries.count()!==2)throw Error('Esperadas exatamente duas misturas');
            const texts=await entries.allTextContents();
            if(!texts[0].includes('Casca de macadâmia')||!texts[1].includes('Casca de pinus'))throw Error('Componentes das alternativas incorretos: '+texts.join(' | '));
            if(texts.some(t=>/\b\d+\s*%/.test(t)))throw Error('Alternativas devem ser qualitativas, sem percentuais: '+texts.join(' | '));
            await page.locator('#ficha img:not(#foto-ampliada-v2)').evaluateAll(nodes=>nodes.forEach(img=>{img.loading='eager'}));
            await page.waitForFunction(() => [...document.querySelectorAll('#ficha img:not(#foto-ampliada-v2)')].every(img => img.complete),null,{timeout:20000});
            const images=await page.locator('#ficha img:not(#foto-ampliada-v2)').evaluateAll(nodes=>nodes.map(img=>({src:img.getAttribute('src'),loaded:img.complete&&img.naturalWidth>0})));
            const broken=images.filter(img=>!img.loaded);
            console.log('TOTAL DE IMAGENS NO CONTEÚDO:',images.length);
            await page.screenshot({path:'macs-ficha-024-diagnostico-desktop.png',fullPage:true});
            console.log('IMAGENS DESKTOP:', JSON.stringify(images));
            if(broken.length)throw Error('Imagens não carregadas: '+JSON.stringify(broken));
            const mainParts=await page.locator('.ingrediente-substrato-v4 .proporcao-substrato-v4').allTextContents();
            if(mainParts.map(s=>s.trim()).join('|')!=='35%|25%|20%|10%|10%')throw Error('Proporções principais divergentes: '+mainParts.join(' | '));
            const photos=images.filter(img=>(img.src||'').includes('Arpophyllum giganteum'));
            if(new Set(photos.map(img=>img.src)).size!==4)throw Error('Esperadas quatro fotos da ficha; encontradas '+photos.length);
            const principalImg=await page.locator('.forma-principal-v4 img').first().getAttribute('src');
            if(!principalImg||!principalImg.includes('especies/arpophyllum-giganteum/vaso-plastico.webp'))throw Error('Cultivo ideal não usa a foto personalizada: '+principalImg);
            const badge=await page.locator('.forma-principal-v4').first().evaluate(el=>{const b=el.getBoundingClientRect();const p=getComputedStyle(el,'::after');return {width:b.width,right:p.right,transform:p.transform}});
            if(badge.transform!=='none'||parseFloat(badge.right)<0)throw Error('Selo de recomendação ainda deslocado: '+JSON.stringify(badge));
            if(errors.length)throw Error('Erros JavaScript: '+errors.join(' | '));
            await section.screenshot({path:'macs-ficha-024-substrato-desktop.png'});
            await page.screenshot({path:'macs-ficha-024-ficha-desktop.png',fullPage:true});
            await page.setViewportSize({width:390,height:844});
            await section.screenshot({path:'macs-ficha-024-substrato-mobile.png'});
            const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>window.innerWidth+2);
            if(overflow)throw Error('Overflow horizontal na visualização celular');
            if(await cultivationMethods.count()!==4)throw Error('Métodos de cultivo ausentes na versão celular');
            await page.screenshot({path:'macs-ficha-024-ficha-mobile.png',fullPage:true});
            if(errors.length)throw Error('Erros JavaScript desktop/mobile: '+errors.join(' | '));
            const mobileEntries=await entries.count();
            if(mobileEntries!==2)throw Error('Alternativas alteradas na versão celular: '+mobileEntries);
            const mobileTexts=await entries.allTextContents();
            if(mobileTexts.some(t=>/\b\d+\s*%/.test(t)))throw Error('Alternativas com percentuais na versão celular: '+mobileTexts.join(' | '));
            const mobileImages=await page.locator('#ficha img:not(#foto-ampliada-v2)').evaluateAll(nodes=>nodes.map(img=>({src:img.getAttribute('src'),loaded:img.complete&&img.naturalWidth>0})));
            const mobileBroken=mobileImages.filter(img=>!img.loaded);
            console.log('IMAGENS MOBILE:', JSON.stringify(mobileImages));
            if(mobileBroken.length)throw Error('Imagens não carregadas no celular: '+JSON.stringify(mobileBroken));
            const mobileParts=await page.locator('.ingrediente-substrato-v4 .proporcao-substrato-v4').allTextContents();
            if(mobileParts.map(s=>s.trim()).join('|')!=='35%|25%|20%|10%|10%')throw Error('Proporções alteradas na versão celular');
            console.log('APROVADO: renderização desktop/mobile, 2 receitas alternativas sem percentuais e sem erros JavaScript.');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macs-ficha-024-inspecao-visual
          path: macs-ficha-024-*.png
          if-no-files-found: ignore
