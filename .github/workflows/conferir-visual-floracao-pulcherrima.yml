name: Conferir visualmente floração — Phalaenopsis pulcherrima
on:
  push:
    paths:
      - '.github/workflows/conferir-visual-floracao-pulcherrima.yml'
      - 'dados/orquideas/phalaenopsis-pulcherrima.js'
      - 'ficha.js'
      - 'orquidea.html'
      - 'estilos.css'
      - 'js/**'
      - 'css/**'
  workflow_dispatch:
jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Validar calendário em Chromium desktop e celular
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/orquidario-server.log 2>&1 &
          node <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1365,height:900},deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:8765/orquidea.html?id=phalaenopsis-pulcherrima',{waitUntil:'networkidle',timeout:60000});
            const calendar=page.locator('.calendario-v2');
            await calendar.waitFor({timeout:30000});
            const check=async label=>{
              const months=calendar.locator('.mes-floracao-v2');
              if(await months.count()!==12)throw Error(label+': calendário não tem 12 meses');
              const active=calendar.locator('.mes-floracao-v2.mes-ativo-v2');
              if(await active.count()!==2)throw Error(label+': esperado 2 meses destacados');
              const names=(await active.allTextContents()).map(s=>s.toLowerCase());
              if(!names.some(s=>s.includes('fev'))||!names.some(s=>s.includes('mai')))throw Error(label+': meses incorretos: '+names.join(' | '));
              const note=calendar.locator('.calendario-floracao-nota');
              if(await note.count()!==1||!(await note.innerText()).includes('Meses indicativos'))throw Error(label+': falta aviso de meses indicativos');
              if(errors.length)throw Error(label+': erros JavaScript: '+errors.join(' | '));
            };
            await check('desktop');
            await calendar.screenshot({path:'floracao-pulcherrima-desktop.png'});
            await page.setViewportSize({width:390,height:844});
            await check('celular');
            const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>window.innerWidth+2);
            if(overflow)throw Error('Overflow horizontal no celular');
            await calendar.screenshot({path:'floracao-pulcherrima-celular.png'});
            console.log('APROVADO: fevereiro e maio destacados, aviso indicativo, 12 meses e ausência de erros JavaScript em desktop/celular.');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: floracao-pulcherrima-capturas
          path: floracao-pulcherrima-*.png
          if-no-files-found: warn
