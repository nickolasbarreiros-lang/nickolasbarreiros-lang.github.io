name: Conferência visual MACS 1.1 — matriz 112
on:
  push:
    paths:
      - '.github/workflows/conferir-visual-macs-112.yml'
      - 'dados/orquideas/blc-chia-lin.js'
      - 'orquidea.html'
      - 'ficha.js'
      - 'estilos.css'
      - 'js/**'
      - 'css/**'
  workflow_dispatch:
jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Conferir ficha em navegador real
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/orquidario-server.log 2>&1 &
          node <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1365,height:900},deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror',error=>errors.push(error.message));
            await page.goto('http://127.0.0.1:8765/orquidea.html?id=blc-chia-lin',{waitUntil:'networkidle',timeout:60000});
            const section=page.locator('.substrato-visual-v4');
            await section.waitFor({timeout:30000});
            const entries=page.locator('.substratos-recomendados-v4 li');
            if(await entries.count()!==2)throw Error('Esperadas exatamente duas misturas');
            const texts=await entries.allTextContents();
            if(!texts[0].toLowerCase().includes('casca de pinus')||!texts[1].toLowerCase().includes('chips de coco'))throw Error('Ingredientes das alternativas divergentes: '+texts.join(' | '));
            if(texts.some(t=>/\b\d+\s*%/.test(t)))throw Error('Alternativas não podem ter percentuais: '+texts.join(' | '));
            const mainParts=await page.locator('.ingrediente-substrato-v4 .proporcao-substrato-v4').allTextContents();
            const values=mainParts.map(s=>Number(s.trim().replace('%','')));
            if(values.length<2||values.some(v=>!Number.isFinite(v))||values.reduce((a,b)=>a+b,0)!==100)throw Error('Mistura principal inválida: '+mainParts.join(' | '));
            await page.locator('#ficha img').evaluateAll(nodes=>nodes.forEach(img=>{img.loading='eager'}));
            await page.waitForFunction(() => [...document.querySelectorAll('#ficha img')].every(img=>img.complete),{timeout:20000});
            const broken=await page.locator('#ficha img').evaluateAll(nodes=>nodes.filter(img=>img.naturalWidth===0).map(img=>img.getAttribute('src')));
            if(broken.length)throw Error('Imagens não carregadas: '+broken.join(' | '));
            if(errors.length)throw Error('Erros JavaScript: '+errors.join(' | '));
            await section.screenshot({path:'macs-112-substrato-desktop.png'});
            await page.screenshot({path:'macs-112-ficha-desktop.png',fullPage:true});
            await page.setViewportSize({width:390,height:844});
            await section.screenshot({path:'macs-112-substrato-mobile.png'});
            const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>window.innerWidth+2);
            if(overflow)throw Error('Overflow horizontal no celular');
            const mobileBroken=await page.locator('#ficha img').evaluateAll(nodes=>nodes.filter(img=>img.complete&&img.naturalWidth===0).map(img=>img.getAttribute('src')));
            if(mobileBroken.length)throw Error('Imagens quebradas no celular: '+mobileBroken.join(' | '));
            await page.screenshot({path:'macs-112-ficha-mobile.png',fullPage:true});
            const mobileTexts=await entries.allTextContents();
            if(mobileTexts.length!==2||mobileTexts.some(t=>/\b\d+\s*%/.test(t)))throw Error('Alternativas inválidas no celular: '+mobileTexts.join(' | '));
            if(errors.length)throw Error('Erros JavaScript desktop/mobile: '+errors.join(' | '));
            console.log('APROVADO: renderização desktop/mobile, 2 receitas alternativas qualitativas sem percentuais e sem erros JavaScript.');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macs-112-inspecao-visual
          path: macs-112-*.png
          if-no-files-found: ignore
