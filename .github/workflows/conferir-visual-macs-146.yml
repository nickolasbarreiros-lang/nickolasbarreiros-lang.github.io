name: Conferência visual MACS 1.1 — matriz 146
on:
  push:
    paths:
      - '.github/workflows/conferir-visual-macs-146.yml'
  workflow_dispatch:
jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Conferir ficha em navegador real
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/orquidario-server.log 2>&1 &
          node <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1465,height:900},deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror',error=>errors.push(error.message));
            await page.goto('http://127.0.0.1:8765/orquidea.html?id=cattleya-pumpkin-festival',{waitUntil:'networkidle',timeout:60000});
            const section=page.locator('.substrato-visual-v4');
            await section.waitFor({timeout:30000});
            const entries=page.locator('.substratos-recomendados-v4 li');
            if(await entries.count()!==2)throw Error('Esperadas exatamente duas misturas');
            const texts=await entries.allTextContents();
            if(!texts[0].includes('Casca de pinus')||!texts[1].includes('Casca de macadâmia'))throw Error('Componentes das alternativas incorretos: '+texts.join(' | '));
            if(texts.some(t=>/\b\d+\s*%/.test(t)))throw Error('Alternativas devem ser qualitativas, sem percentuais: '+texts.join(' | '));
            const images=await page.locator('#ficha img').evaluateAll(nodes=>nodes.map(img=>({src:img.getAttribute('src'),loaded:img.complete&&img.naturalWidth>0})));
            const broken=images.filter(img=>!img.loaded);
            if(broken.length)throw Error('Imagens não carregadas: '+JSON.stringify(broken));
            const photos=images.filter(img=>/Cattleya Pumpkin Festival[1-4]\\.(webp|png)/i.test(img.src||''));
            if(new Set(photos.map(img=>img.src)).size!==4)throw Error('Esperadas quatro fotos da ficha; encontradas '+photos.length);
            if(errors.length)throw Error('Erros JavaScript: '+errors.join(' | '));
            await section.screenshot({path:'macs-146-substrato-desktop.png'});
            await page.screenshot({path:'macs-146-ficha-desktop.png',fullPage:true});
            await page.setViewportSize({width:390,height:844});
            await section.screenshot({path:'macs-146-substrato-mobile.png'});
            const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>window.innerWidth+2);
            if(overflow)throw Error('Overflow horizontal na visualização celular');
            await page.screenshot({path:'macs-146-ficha-mobile.png',fullPage:true});
            console.log('APROVADO: renderização desktop/mobile, 2 receitas alternativas sem percentuais e sem erros JavaScript.');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macs-146-inspecao-visual
          path: macs-146-*.png
          if-no-files-found: ignore
