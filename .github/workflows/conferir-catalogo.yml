name: Conferir catálogo de orquídeas
on:
  push:
    paths:
      - 'dados/orquideas/**'
      - 'catalogo-manifesto.json'
      - 'scripts/verificar_catalogo.py'
  pull_request:
  workflow_dispatch:
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/verificar_catalogo.py
      - name: Validar sintaxe JavaScript de todas as fichas
        shell: bash
        run: |
          set -euo pipefail
          for arquivo in dados/orquideas/*.js; do
            node --input-type=module --check < "$arquivo"
          done
          echo 'Sintaxe JavaScript de todas as fichas aprovada.'
