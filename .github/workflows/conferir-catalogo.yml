name: Conferir catálogo de orquídeas
on:
  push:
    paths:
      - 'dados/orquideas/**'
      - 'catalogo-manifesto.json'
      - 'scripts/verificar_catalogo.py'
  pull_request:
  workflow_dispatch:
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/verificar_catalogo.py
