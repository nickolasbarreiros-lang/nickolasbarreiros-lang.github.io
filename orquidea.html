<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Ficha detalhada de cultivo de orquídeas."
    >

    <title>Ficha da Orquídea</title>

    <link
        rel="stylesheet"
        href="estilos.css?v=sprint-3-0-20260726"
    >

</head>

<body class="pagina-ficha">

    <header class="cabecalho">

        <h1>
            Ficha da Orquídea
        </h1>

        <p>
            Catálogo particular cultivado em Serra/ES
        </p>

    </header>

    <main class="container">

        <a
            href="index.html"
            class="voltar voltar-ficha-v3"
        >
            <span aria-hidden="true">←</span>
            Voltar ao catálogo
        </a>

        <article
            id="ficha"
            class="ficha-detalhada"
        >
        </article>

        <div
            id="ficha-nao-encontrada"
            class="sem-resultados"
            style="display:none;"
        >

            <h2>
                Orquídea não encontrada
            </h2>

            <p>
                Não foi possível localizar esta espécie.
            </p>

        </div>

    </main>

    <footer class="rodape">

        Catálogo particular de orquídeas

    </footer>

    <script
        type="module"
        src="ficha.js?v=sprint-3-0-20260726"
    ></script>

    <!--
        Correção defensiva da iluminação.
        Este módulo também corrige páginas renderizadas por versões antigas
        do ficha.js que convertiam o objeto em "[object Object]".
    -->
    <script type="module">
        import { orquideas } from "./dados/orquideas/index.js?v=visual-1-5-20260724";

        const idAtual = new URLSearchParams(window.location.search).get("id");
        const especieAtual = orquideas.find((item) => String(item.id) === String(idAtual));

        function escaparHtml(valor) {
            return String(valor ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function montarIluminacao(iluminacao) {
            if (!iluminacao) return "Não informado";
            if (typeof iluminacao !== "object") return escaparHtml(iluminacao);

            const itens = [];
            if (iluminacao.sombrite) {
                itens.push(`<span class="chip-info-v2"><span aria-hidden="true">🟨</span><span>${escaparHtml(iluminacao.sombrite)} de sombrite</span></span>`);
            }

            if (iluminacao.solDireto) {
                const valor = String(iluminacao.solDireto).trim().toLowerCase();
                const texto = valor === "sim" ? "Com sol direto" :
                    (valor === "não" || valor === "nao") ? "Sem sol direto" : iluminacao.solDireto;
                const icone = valor === "sim" ? "☀️" : "🚫";
                itens.push(`<span class="chip-info-v2"><span aria-hidden="true">${icone}</span><span>${escaparHtml(texto)}</span></span>`);
            }

            if (iluminacao.horario) {
                itens.push(`<span class="chip-info-v2"><span aria-hidden="true">🕘</span><span>${escaparHtml(iluminacao.horario)}</span></span>`);
            }

            const linha = itens.length
                ? `<div class="linha-chips-v2">${itens.join("")}</div>`
                : "";
            const observacoes = iluminacao.observacoes
                ? `<p class="observacao-card-v2">${escaparHtml(iluminacao.observacoes)}</p>`
                : "";

            return linha + observacoes || "Não informado";
        }

        function corrigirIluminacaoRenderizada() {
            if (!especieAtual) return false;

            const titulos = [...document.querySelectorAll("#ficha h3, #ficha h4, #ficha strong")];
            const titulo = titulos.find((elemento) =>
                elemento.textContent.trim().toLowerCase() === "iluminação"
            );

            if (!titulo) return false;

            const card = titulo.closest(".card-cultivo-v2, .bloco-informacao, article, .card");
            if (!card) return false;

            let conteudo = card.querySelector(".conteudo-card-cultivo-v2");
            if (conteudo) {
                conteudo.querySelectorAll(".linha-chips-v2, .info-horizontal, .observacao-card-v2").forEach((elemento) => elemento.remove());
                titulo.insertAdjacentHTML("afterend", montarIluminacao(especieAtual.iluminacao));
            } else {
                const paragrafos = [...card.querySelectorAll("p")];
                const alvo = paragrafos.find((p) => p.textContent.includes("[object Object]")) || paragrafos[0];
                if (alvo) {
                    alvo.classList.add("conteudo-iluminacao-corrigido");
                    alvo.innerHTML = montarIluminacao(especieAtual.iluminacao);
                } else {
                    titulo.insertAdjacentHTML("afterend", montarIluminacao(especieAtual.iluminacao));
                }
            }

            card.classList.add("card-iluminacao-v2", "iluminacao-corrigida-v15");
            return true;
        }

        if (!corrigirIluminacaoRenderizada()) {
            const observador = new MutationObserver(() => {
                if (corrigirIluminacaoRenderizada()) observador.disconnect();
            });
            observador.observe(document.getElementById("ficha"), { childList: true, subtree: true });
            window.setTimeout(() => observador.disconnect(), 10000);
        }
    </script>

</body>

</html>
